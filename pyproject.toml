[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlatelier"
version = "1.1.0"
description = "Zero-code ML prototyping dashboard: tabular, vision, NLP, Bayesian optimisation, XAI, and Gemini AI assistant."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Md Abdullah Al Kafi", email = "kafi.cse@diu.edu.bd" },
    { name = "Habib Mohammed Sunny", email = "sunny2305101660@diu.edu.bd" },
]
maintainers = [{ name = "Md Abdullah Al Kafi", email = "kafi.cse@diu.edu.bd" }]
keywords = ["machine-learning", "dashboard", "streamlit", "automl", "nlp", "xai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    # Web app
    "streamlit>=1.33.0",
    "requests>=2.31.0",

    # Data handling & plotting
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.12.0",
    "tabulate>=0.9.0",
    "pillow>=10.0.0",          # imported directly by inference_engine and reporting

    # Excel readers. pandas.read_excel delegates to these and does not depend on
    # them itself; file_utils.TABULAR_TYPES advertises .xlsx and .xls, so both
    # engines are required for the upload widget to honour what it accepts.
    "openpyxl>=3.1.0",         # .xlsx / .xlsm
    "xlrd>=2.0.1",             # legacy .xls

    # Tabular ML core
    "scikit-learn>=1.4.0",
    "scikit-optimize>=0.10.0",
    "joblib>=1.3.0",

    # Tabular ML extras (classifiers & imbalance)
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",

    # Explainability
    "shap>=0.44.0",
    "lime>=0.2.0.1",

    # Vision / deep learning
    "torch>=2.2.0",
    "torchvision>=0.17.0",

    # NLP
    "nltk>=3.8.0",
    "sentence-transformers>=2.6.0",
    "transformers>=4.40.0",
    "wordcloud>=1.9.0",

    # Gemini AI assistant
    "google-genai>=0.4.0",

    # ONNX export for cross-platform inference.
    # skl2onnx converts scikit-learn pipelines; onnxmltools supplies the
    # converters for the XGBoost and LightGBM backends.
    "skl2onnx>=1.16.0",
    "onnxmltools>=1.12.0",

    # Counterfactual explanations.
    "dice-ml>=0.11",
]

# NOTE: there are deliberately no user-facing optional extras.
# MLatelier is a zero-code tool driven from a browser: a user who clicks a
# button must not be met with "this feature needs another pip install", and a
# missing import inside a Streamlit callback surfaces as a broken page rather
# than an actionable message. Every runtime dependency is therefore required.
# The dev extra below is for contributors only and installs no runtime code.
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "onnxruntime>=1.17.0",   # used by the tests to load exported ONNX graphs
]

[project.scripts]
mlatelier = "mlatelier.__main__:main"

[project.urls]
Homepage = "https://github.com/abkafi1234/MLatelier"
Repository = "https://github.com/abkafi1234/MLatelier"
Documentation = "https://github.com/abkafi1234/MLatelier/blob/main/docs/index.md"
"Bug Tracker" = "https://github.com/abkafi1234/MLatelier/issues"
Changelog = "https://github.com/abkafi1234/MLatelier/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/mlatelier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
